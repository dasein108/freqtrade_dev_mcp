[project]
name = "freqtrade-mcp"
version = "1.0.0"
description = "MCP server exposing Freqtrade backtesting, hyperopt and data tools to LLM clients, plus a LangGraph agent for autonomous strategy development"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "dasein108"},
]
keywords = ["freqtrade", "mcp", "model-context-protocol", "trading", "backtesting", "hyperopt", "crypto", "langgraph", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=0.9.0",
    "freqtrade>=2025.7",
    "dateparser>=1.1.0",
    "pycoingecko>=3.0.0",
    "pydantic>=2.0.0",
    "pandas>=1.5.0",
    "aiofiles>=23.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "instructor>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "groq>=0.4.0",
    "together>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
freqtrade-mcp = "src.server:main"

[project.urls]
Homepage = "https://github.com/dasein108/freqtrade_dev_mcp"
Repository = "https://github.com/dasein108/freqtrade_dev_mcp"
Issues = "https://github.com/dasein108/freqtrade_dev_mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# black enforces line length; the remaining long lines are unsplittable string literals
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"