[project]
name = "freqtrade-mcp"
version = "1.0.0"
description = "MCP server for Freqtrade - backtesting, hyperopt, and data management via Model Context Protocol"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Freqtrade MCP Team"},
]
keywords = ["freqtrade", "mcp", "trading", "backtesting", "crypto"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=0.9.0",
    "freqtrade>=2025.7",
    "dateparser>=1.1.0",
    "pycoingecko>=3.0.0",
    "pydantic>=2.0.0",
    "pandas>=1.5.0",
    "aiofiles>=23.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
freqtrade-mcp = "src.server:main"

[project.urls]
Homepage = "https://github.com/freqtrade/freqtrade-mcp"
Repository = "https://github.com/freqtrade/freqtrade-mcp"
Issues = "https://github.com/freqtrade/freqtrade-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
target-version = "py38"

[tool.ruff.per-file-ignores]
"tests/*" = ["F401", "F811"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.mypy]
python_version = "3.8"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"